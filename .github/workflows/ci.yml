# CI for every pull request and every push to main (ENG-012).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_SITE_URL: http://localhost:3100

# SEC-011 (Batch 11): the workflow token can only read the repository.
permissions:
  contents: read

jobs:
  quality:
    name: Types, lint, format, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:css
      - run: pnpm lint:copy
      - run: pnpm format:check
      - run: pnpm test
      - name: Sanity Studio types and schema
        run: |
          pnpm --dir studio install --frozen-lockfile --ignore-workspace
          pnpm studio:check

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 detect --source /repo --redact --no-banner

  build-and-e2e:
    name: Build, bundle budget, end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with: { version: 2.111.0 }
      - name: Start local Supabase (database, Auth, mail catcher) for sign-in flows
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Build against the local database (never staging)
        run: pnpm with-local-db pnpm build
      - run: pnpm budget
      - name: No secrets in the client bundle
        run: pnpm check:client-secrets
      - run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end, production settings
        run: pnpm with-local-db pnpm test:e2e
      - name: End-to-end with dev routes (500 page, component gallery, visual parity)
        run: pnpm with-local-db pnpm test:e2e
        env: { ENABLE_DEV_ROUTES: "true" }
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: visual-parity, path: docs/screenshots/batch-02/parity, retention-days: 14 }
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  database:
    name: Database (migrations from scratch, RLS tests, types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with: { version: 2.111.0 }
      - name: Start Supabase and apply every migration and the seed
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit
      - name: Database tests (pgTAP)
        run: supabase test db
      - name: API tests (PostgREST and Auth, as the app calls them)
        run: pnpm test:db-api
      - name: Generated types are up to date
        run: |
          pnpm db:types
          git diff --exit-code src/server/db/database.types.ts || (echo "Run pnpm db:types and commit the result." && exit 1)

  lighthouse:
    name: Lighthouse (mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # PERF-001–003 (Batch 11): the key templates need data, so Lighthouse measures against the seeded local database.
      - uses: supabase/setup-cli@v1
        with: { version: 2.111.0 }
      - name: Start local Supabase with the seed
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit
      - run: pnpm with-local-db pnpm build
      - run: pnpm with-local-db pnpm lhci
      - uses: actions/upload-artifact@v7
        if: always()
        # .lighthouseci starts with a dot; upload-artifact skips hidden paths unless told otherwise.
        with: { name: lighthouse, path: .lighthouseci, retention-days: 14, include-hidden-files: true }
